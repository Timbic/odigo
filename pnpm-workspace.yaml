saveExact: true
nodeVersion: "24.22.1"

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 86400 # 1 day
minimumReleaseAgeExclude:
    - "@timbic/*"
overrides:
    glob: ^13.0.0
    compression: ^1.8.0
    esbuild: 0.28.1
    cssnano: ^8.0.10
allowBuilds:
    esbuild: true
    unrs-resolver: true
    vue-demi: true
