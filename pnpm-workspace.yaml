saveExact: true
nodeVersion: "22.22.2"

trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 86400 # 1 day
minimumReleaseAgeExclude:
    - "@timbic/*"
    - brace-expansion@5.0.9
overrides:
    glob: ^13.0.0
    compression: ^1.8.0
    esbuild@>=0.27.3 <0.28.1: 0.28.1
peerDependencyRules:
    allowedVersions:
        "@unhead/vue": 3.4.1
allowBuilds:
    esbuild: true
    unrs-resolver: true
    vue-demi: true
